name: content-pipeline

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate content
        env:
          BATCH_ITEMS: "49"
        run: |
          if [ -f scripts/batch_generate.py ]; then
            python3 scripts/batch_generate.py
          else
            python3 floki_agent_team.py --batch
          fi
      - name: Commit hasil
        run: |
          git config user.name  "floki-agent-bot"
          git config user.email "bot@users.noreply.github.com"
          git add outputs/
          if git diff --staged --quiet; then
            echo "tidak ada perubahan"
          else
            git commit -m "chore(content): regenerate $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
